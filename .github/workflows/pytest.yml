name: pytest

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
    
    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.62.1
        
    - name: Run pytest with coverage
      run: pixi run pytest tests/ -v --cov=src/park_vga --cov-report=term-missing
      
    - name: Show coverage summary
      if: always()
      run: echo "Coverage report generated above"