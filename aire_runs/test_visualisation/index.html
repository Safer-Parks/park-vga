<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Layer Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info {
            padding: 6px 8px;
            font-size: 14px;
            background: white;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // Initialize map centered on UK
        const map = L.map('map').setView([51.6, -0.647], 12);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Create layer groups
        const polygonLayer = L.layerGroup();
        const centroidLayer = L.layerGroup();

        // Load GeoJSON files
        fetch('../test_polygon.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: 'blue',
                        weight: 2,
                        opacity: 0.7,
                        fillOpacity: 0.3
                    }
                }).addTo(polygonLayer);
            })
            .catch(error => console.error('Error loading polygons:', error));

        fetch('../test_centroids.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: 'red',
                            color: '#000',
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.7
                        });
                    }
                }).addTo(centroidLayer);
            })
            .catch(error => console.error('Error loading centroids:', error));

        // Add layers to map by default
        polygonLayer.addTo(map);
        centroidLayer.addTo(map);

        // Create layer control
        const baseLayers = {};
        const overlays = {
            'Polygons': polygonLayer,
            'Centroids': centroidLayer
        };

        L.control.layers(baseLayers, overlays).addTo(map);
    </script>
</body>
</html>
