name: pytest

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev
    
    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.62.1
    
    - name: Verify GDAL drivers
      run: pixi run python -c "from osgeo import gdal; print('GDAL Version:', gdal.__version__); driver = gdal.GetDriverByName('GTiff'); print('GeoTIFF driver available:', driver is not None)"
        
    - name: Run pytest with coverage
      run: pixi run pytest tests/ -v
      
    - name: Show coverage summary
      if: always()
      run: echo "Coverage report generated above"